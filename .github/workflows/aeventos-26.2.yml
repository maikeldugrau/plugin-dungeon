name: Build aEventos 26.2
# port revision 4

on:
  workflow_dispatch:
  push:
    branches:
      - aeventos-26.2-build
    paths:
      - 'aeventos-26.2/**'
      - '.github/workflows/aeventos-26.2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          ref: aeventos-26.2-build

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Clone official aEventos
        run: git clone --depth 1 https://github.com/Ars3ne/aEventos.git aeventos-src

      - name: Apply Paper 26.2 port
        run: python3 aeventos-26.2/apply_port.py aeventos-src

      - name: Build
        working-directory: aeventos-src
        run: mvn -B -U -DskipTests clean package

      - name: Show artifacts
        if: always()
        run: find aeventos-src/target -maxdepth 1 -type f -printf '%f\n' || true

      - name: Package transformed source
        if: always()
        run: zip -qr aEventos-MCGames-26.2-source.zip aeventos-src -x 'aeventos-src/.git/*' 'aeventos-src/target/*'

      - name: Upload transformed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aEventos-MCGames-26.2-source
          path: aEventos-MCGames-26.2-source.zip

      - name: Upload plugin jar and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aEventos-MCGames-26.2
          path: |
            aeventos-src/target/*.jar
            aeventos-src/MCGAMES-26.2-PORT.md
            aeventos-src/LICENSE
          if-no-files-found: error
